services:
  - type: web
    name: vyrobot
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn vyrobot.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
